# Apply alongside docker-compose.yml. Publish through an authenticated HTTPS proxy.
services:
  app:
    ports: !override
      - "127.0.0.1:11000:11000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  validation-demo:
    build:
      context: .
      dockerfile: deploy/validation.Dockerfile
    image: hj-ai-validation:${RELEASE_TAG:-candidate}
    restart: unless-stopped
    env_file:
      - ${VALIDATION_ENV_FILE:-./deploy/validation.env}
    environment:
      NODE_ENV: production
      DEMO_HOST: 0.0.0.0
      AI_SERVER_BASE_URL: http://app:11000
    ports:
      - "127.0.0.1:11001:11001"
    volumes:
      - validation-reports:/app/demo/reports
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11001/api/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  validation-reports:
