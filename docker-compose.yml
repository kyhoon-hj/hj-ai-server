services:
  app:
    build:
      context: .
      target: production
    image: hj-ai-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 11000
      API_GLOBAL_PREFIX: "${API_GLOBAL_PREFIX:-}"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      SWAGGER_PATH: "${SWAGGER_PATH:-api-docs}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    ports:
      - "11000:11000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||11000)+'/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
