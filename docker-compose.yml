x-hj-standard-ports:
  ai-server: 11000
  validation-demo: 11001
  service-demo: 11002

services:
  app:
    build:
      context: .
      target: production
    image: hj-ai-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 11000
      API_GLOBAL_PREFIX: "${API_GLOBAL_PREFIX:-}"
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-false}"
      SWAGGER_PATH: "${SWAGGER_PATH:-api-docs}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      ENABLE_TEST_TABLE_API: "${ENABLE_TEST_TABLE_API:-false}"
      ENABLE_LEGACY_BEDROCK_INSPECTION_API: "${ENABLE_LEGACY_BEDROCK_INSPECTION_API:-false}"
      ENABLE_LEGACY_KNOWLEDGE_WRITE_API: "${ENABLE_LEGACY_KNOWLEDGE_WRITE_API:-false}"
      APPKEY_TTL_DAYS: "${APPKEY_TTL_DAYS:-90}"
      APPKEY_MAX_ROTATION_GRACE_SECONDS: "${APPKEY_MAX_ROTATION_GRACE_SECONDS:-86400}"
      ADMIN_API_KEY_PREVIOUS: "${ADMIN_API_KEY_PREVIOUS:-}"
      ADMIN_API_KEY_PREVIOUS_VALID_UNTIL: "${ADMIN_API_KEY_PREVIOUS_VALID_UNTIL:-}"
      KNOWLEDGE_OPERATOR_API_KEY_PREVIOUS: "${KNOWLEDGE_OPERATOR_API_KEY_PREVIOUS:-}"
      KNOWLEDGE_OPERATOR_API_KEY_PREVIOUS_VALID_UNTIL: "${KNOWLEDGE_OPERATOR_API_KEY_PREVIOUS_VALID_UNTIL:-}"
      DOCKER_DATABASE_HOST: "${DOCKER_DATABASE_HOST:-host.docker.internal}"
    command: node config/start-container.mjs
    ports:
      - "11000:11000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||11000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
